<!DOCTYPE html>
<meta charset="utf-8" />
<title>pin newspaper corners</title>
<style>
  html, body { margin: 0; background: #111; color: #eee; font: 14px/1.4 ui-monospace, monospace; }
  #wrap { position: relative; display: inline-block; max-width: 100vw; }
  img { display: block; max-width: 100vw; max-height: 78vh; width: auto; height: auto; }
  .pin {
    position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border-radius: 50%; border: 2px solid #fff; cursor: grab; z-index: 2;
  }
  .pin:active { cursor: grabbing; }
  #TL { background: #e74c3c; }
  #TR { background: #2ecc71; }
  #BR { background: #3498db; }
  #BL { background: #f1c40f; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  pre { margin: 12px; white-space: pre-wrap; }
  .hint { margin: 8px 12px; color: #aaa; }
</style>
<p class="hint">Drag the 4 pins onto the page corners. Red TL, green TR, blue BR, yellow BL. Copy the vec2s.</p>
<div id="wrap">
  <img id="img" src="background.jpg" alt="" />
  <svg id="lines"></svg>
  <div class="pin" id="TL"></div>
  <div class="pin" id="TR"></div>
  <div class="pin" id="BR"></div>
  <div class="pin" id="BL"></div>
</div>
<pre id="out"></pre>
<script>
const pts = {
  TL: [0.464, 0.052],
  TR: [0.809, 0.139],
  BR: [0.750, 0.544],
  BL: [0.408, 0.446],
};
const order = ["TL", "TR", "BR", "BL"];
const img = document.getElementById("img");
const wrap = document.getElementById("wrap");
const lines = document.getElementById("lines");
const out = document.getElementById("out");

function size() {
  return { w: img.clientWidth, h: img.clientHeight };
}

function place() {
  const { w, h } = size();
  if (!w || !h) return;
  for (const id of order) {
    const el = document.getElementById(id);
    el.style.left = pts[id][0] * w + "px";
    el.style.top = pts[id][1] * h + "px";
  }
  const poly = order.map((id) => `${pts[id][0] * w},${pts[id][1] * h}`).join(" ");
  lines.innerHTML = `<polygon points="${poly}" fill="rgba(255,80,80,0.12)" stroke="#fff" stroke-width="1.5"/>`;
  out.textContent = order
    .map((id) => `const vec2 ${id} = vec2(${pts[id][0].toFixed(3)}, ${pts[id][1].toFixed(3)});`)
    .join("\n");
}

function bind(id) {
  const el = document.getElementById(id);
  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", (e) => {
    if (!el.hasPointerCapture(e.pointerId)) return;
    const r = wrap.getBoundingClientRect();
    const { w, h } = size();
    pts[id][0] = Math.min(1, Math.max(0, (e.clientX - r.left) / w));
    pts[id][1] = Math.min(1, Math.max(0, (e.clientY - r.top) / h));
    place();
  });
}

order.forEach(bind);
img.addEventListener("load", place);
window.addEventListener("resize", place);
if (img.complete) place();
</script>
